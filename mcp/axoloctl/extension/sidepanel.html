<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Axoloctl</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
    }
    #control-bar {
      padding: 8px 12px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #correlation-bar {
      padding: 6px 12px;
      background-color: #090d16;
      border-bottom: 1px solid #334155;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .status-pill.correlated {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
    }
    .status-pill.uncorrelated {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    select {
      padding: 4px 8px;
      font-size: 13px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 4px;
    }
    button {
      padding: 4px 8px;
      font-size: 13px;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #475569;
    }
    #agent-viewport {
      flex: 1;
      width: 100%;
      border: none;
      background: #0f172a;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="control-bar">
    <div style="font-weight: 600; color: #38bdf8; font-size: 14px;">Axoloctl Agent</div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <select id="ui-selector" class="hidden"></select>
      <button id="refresh-btn" title="Refresh UI & Re-Correlate">⟳</button>
    </div>
  </div>
  <div id="correlation-bar">
    <span id="correlation-status" class="status-pill uncorrelated">Probing active tab...</span>
    <span id="correlation-nonce" style="font-family: monospace; color: #94a3b8; font-size: 11px;"></span>
  </div>
  <iframe id="agent-viewport" src="about:blank"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
