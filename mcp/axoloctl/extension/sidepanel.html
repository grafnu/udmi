<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Axoloctl</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f5f5f5;
    }
    #control-bar {
      padding: 8px;
      background-color: #e0e0e0;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    select {
      padding: 4px 8px;
      font-size: 14px;
      border: 1px solid #aaa;
      border-radius: 4px;
    }
    button {
      padding: 4px 8px;
      font-size: 14px;
      cursor: pointer;
    }
    #agent-viewport {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="control-bar">
    <div style="font-weight: bold; color: #555;">Axoloctl Agent</div>
    <select id="ui-selector" class="hidden"></select>
    <button id="refresh-btn" title="Refresh UI">⟳</button>
  </div>
  <iframe id="agent-viewport" src="about:blank"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
