<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Axoloctl</title>
  <link rel="icon" type="image/svg+xml" href="icons/axoloctl.svg">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #0f172a;
      color: #f8fafc;
    }
    #control-bar {
      padding: 5px 8px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      min-width: 0;
    }
    .correlation-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }
    #brand-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: block;
      background: transparent;
      border: none;
    }
    .controls-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    #session-selector {
      flex: 1;
      min-width: 0;
      max-width: 185px;
      padding: 3px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-overflow: ellipsis;
    }
    #session-selector.correlated {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
    }
    #session-selector.verifying {
      background: #451a03;
      color: #fcd34d;
      border: 1px solid #d97706;
    }
    #session-selector.uncorrelated {
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    #session-selector option {
      background: #0f172a;
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #ui-selector {
      padding: 3px 6px;
      font-size: 12px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 4px;
      max-width: 112px;
    }
    button {
      padding: 3px 7px;
      font-size: 12px;
      line-height: 1.2;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: #475569;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0369a1;
      color: #ffffff;
      font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) {
      background: #0369a1;
    }
    #new-session-modal {
      padding: 6px 8px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .new-session-form {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .new-session-form label {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #new-session-input {
      flex: 1;
      min-width: 0;
      padding: 3px 6px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #020617;
      color: #f8fafc;
      border: 1px solid #38bdf8;
      border-radius: 4px;
    }
    #new-session-error {
      margin-top: 4px;
      font-size: 11px;
      color: #fda4af;
      overflow-wrap: anywhere;
    }
    #agent-viewport {
      display: block;
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      background: #0f172a;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="control-bar">
    <div class="correlation-group">
      <img id="brand-icon" src="icons/axoloctl.svg" alt="Axoloctl" title="Axoloctl Control Panel" />
      <select id="session-selector" class="uncorrelated" title="Select a tagged session or create a new one">
        <option value="">Probing tab...</option>
        <option value="__new__">New...</option>
      </select>
      <span id="correlation-status" class="hidden">Probing tab...</span>
      <span id="correlation-nonce" class="hidden"></span>
    </div>
    <div class="controls-group">
      <select id="ui-selector" class="hidden"></select>
      <button id="refresh-btn" title="Refresh UI &amp; Verify Page">⟳</button>
    </div>
  </div>
  <div id="new-session-modal" class="hidden">
    <form id="new-session-form" class="new-session-form">
      <label for="new-session-input">Session name:</label>
      <input type="text" id="new-session-input" placeholder="e.g. feature_ui" autocomplete="off" />
      <button type="submit" id="new-session-submit" class="btn-primary">Create</button>
      <button type="button" id="new-session-cancel">✕</button>
    </form>
    <div id="new-session-error" class="hidden"></div>
  </div>
  <iframe id="agent-viewport" src="about:blank"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
